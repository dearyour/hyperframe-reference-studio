name: Validate skill package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test portable projects and inspection failures
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build a clean demo project and lint it
        run: |
          python3 skills/hyperframe-reference-studio/scripts/new_project.py /tmp/studio-demo
          cd /tmp/studio-demo
          npm ci --no-audit --no-fund
          npm run setup
          npm run lint
